<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf8f3" />
    <link rel="icon" href="data:," />
    <title></title>
    <script id="site-branding-bootstrap">
      try {
        const branding = JSON.parse(localStorage.getItem('ace-site-branding'));
        if (branding && typeof branding.system_name === 'string') {
          document.title = branding.system_name;
          document.querySelector('link[rel="icon"]').href = typeof branding.favicon === 'string' && branding.favicon
            ? branding.favicon : '/newapi-admin/favicon.ico';
        }
      } catch { /* No cached branding on the first visit or when storage is disabled. */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
