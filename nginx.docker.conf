# This listener is published on loopback only. The outer TLS proxy must overwrite
# X-Forwarded-Proto; direct local HTTP requests fall back to their actual scheme.
map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    http http;
    https https;
}

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $new_api_upstream new-api:3000;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32m;

    location ^~ /api/ {
        proxy_pass http://$new_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location = /api {
        proxy_pass http://$new_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location ^~ /v1/ {
        proxy_pass http://$new_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location ^~ /v1beta/ {
        proxy_pass http://$new_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, private, max-age=0" always;
        try_files /index.html =404;
    }

    location = /login {
        add_header Cache-Control "no-store, no-cache, must-revalidate, private, max-age=0" always;
        try_files /index.html =404;
    }

    location = /register {
        add_header Cache-Control "no-store, no-cache, must-revalidate, private, max-age=0" always;
        try_files /index.html =404;
    }

    location = /forgot-password {
        add_header Cache-Control "no-store, no-cache, must-revalidate, private, max-age=0" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /index.html =404;
    }

    location ^~ /oauth/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, private, max-age=0" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /index.html =404;
    }

    location = /user/reset {
        add_header Cache-Control "no-store, no-cache, must-revalidate, private, max-age=0" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /index.html =404;
    }

    location = /reset {
        add_header Cache-Control "no-store, no-cache, must-revalidate, private, max-age=0" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /index.html =404;
    }

    location = /console {
        add_header Cache-Control "no-store, no-cache, must-revalidate, private, max-age=0" always;
        try_files /index.html =404;
    }

    location ^~ /console/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, private, max-age=0" always;
        try_files /index.html =404;
    }

    location = /admin {
        add_header Cache-Control "no-store, no-cache, must-revalidate, private, max-age=0" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, private, max-age=0" always;
        try_files /index.html =404;
    }

    location = /newapi-admin {
        return 302 /;
    }

    location = /newapi-admin/ {
        return 302 /;
    }

    location ^~ /newapi-admin/ {
        rewrite ^/newapi-admin/(.*)$ /$1 break;
        proxy_pass http://$new_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        proxy_pass http://$new_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_buffering off;
    }
}
