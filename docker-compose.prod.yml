services:
  new-api:
    environment:
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_TRUSTED_URL: ${SITE_URL:?Set SITE_URL to your public HTTPS origin in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set a persistent SESSION_SECRET in .env}
      CRYPTO_SECRET: ${CRYPTO_SECRET:?Set a persistent CRYPTO_SECRET in .env}
